name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use pinned npm
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting and public copy
        run: |
          npm run format:check
          npm run public-copy:check

      - name: Lint
        run: npm run lint

      - name: Check generated binding types
        run: npm run typegen:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests serially
        run: npm run test:e2e -- --workers=1

      - name: Generate production types
        run: npm run typegen:production

      - name: Build and verify the production deploy dry-run
        run: npm run deploy:dry-run:production
